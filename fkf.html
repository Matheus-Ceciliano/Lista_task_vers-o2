<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Task - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Animações Customizadas */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-card {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .btn-hover {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-hover:active {
            transform: scale(0.95);
        }

        .completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans antialiased text-slate-900">

    <div class="max-w-4xl mx-auto p-4 md:p-10">
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">Master Task</h1>
            <p class="text-slate-500">Gerencie suas tarefas com um toque.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">

            <div class="md:col-span-5">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 sticky top-10">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-plus-circle text-indigo-500"></i> Nova Tarefa
                    </h2>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nome da
                                Tarefa</label>
                            <input type="text" id="taskName" placeholder="Ex: Estudar React"
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Data Limite</label>
                            <input type="date" id="taskDate"
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>

                        <button onclick="addTask()"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 btn-hover flex items-center justify-center gap-2">
                            <i class="fas fa-save"></i> Adicionar à Lista
                        </button>
                    </div>
                </div>
            </div>

            <div class="md:col-span-7">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold">Sua Lista</h2>
                    <span id="counter" class="bg-slate-200 text-slate-600 text-xs font-bold px-3 py-1 rounded-full">0
                        Tarefas</span>
                </div>

                <div id="taskList" class="space-y-3">
                </div>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function renderTasks() {
            const list = document.getElementById('taskList');
            const counter = document.getElementById('counter');
            list.innerHTML = '';

            counter.innerText = `${tasks.length} ${tasks.length === 1 ? 'Tarefa' : 'Tarefas'}`;

            if (tasks.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-10 opacity-40">
                        <i class="fas fa-clipboard-list text-5xl mb-3"></i>
                        <p>Nenhuma tarefa por aqui ainda.</p>
                    </div>`;
                return;
            }

            tasks.forEach((task, index) => {
                const isCompleted = task.status === 'Concluído';

                list.innerHTML += `
                    <div class="task-card bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="flex-1 w-full text-center sm:text-left">
                            <div class="flex items-center gap-2 justify-center sm:justify-start">
                                <h3 class="font-bold text-slate-800 ${isCompleted ? 'completed' : ''}">${task.name}</h3>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${isCompleted ? 'bg-green-100 text-green-600' : 'bg-amber-100 text-amber-600'}">
                                    ${task.status}
                                </span>
                            </div>
                            <p class="text-sm text-slate-400 mt-1">
                                <i class="far fa-calendar-alt mr-1"></i> ${formatDate(task.date)}
                            </p>
                        </div>
                        
                        <div class="flex gap-2 w-full sm:w-auto">
                            <button onclick="toggleTask(${index})" 
                                class="flex-1 sm:flex-none py-2 px-4 rounded-lg font-bold text-sm btn-hover ${isCompleted ? 'bg-slate-100 text-slate-500' : 'bg-emerald-500 text-white'}">
                                <i class="fas ${isCompleted ? 'fa-undo' : 'fa-check'}"></i>
                            </button>
                            <button onclick="deleteTask(${index})" 
                                class="flex-1 sm:flex-none py-2 px-4 bg-rose-50 text-rose-500 rounded-lg font-bold text-sm hover:bg-rose-500 hover:text-white btn-hover">
                                <i class="fas fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function addTask() {
            const nameInput = document.getElementById('taskName');
            const dateInput = document.getElementById('taskDate');

            if (!nameInput.value || !dateInput.value) {
                alert("Preencha todos os campos!");
                return;
            }

            const newTask = {
                name: nameInput.value,
                date: dateInput.value,
                status: 'Pendente'
            };

            tasks.push(newTask);
            saveAndRender();

            nameInput.value = '';
            dateInput.value = '';
        }

        function toggleTask(index) {
            tasks[index].status = tasks[index].status === 'Pendente' ? 'Concluído' : 'Pendente';
            saveAndRender();
        }

        function deleteTask(index) {
            if (confirm("Deseja mesmo excluir?")) {
                tasks.splice(index, 1);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function formatDate(dateStr) {
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year}`;
        }

        // Inicializar
        renderTasks();
    </script>
</body>

</html>
